# Keeps the project cards on daudmabena.github.io in step with GitHub.
#
# The site was generated by gitfolio, which bakes repository data into
# index.html. Without something like this, the card list reflects whenever the
# generator last ran: stars, forks, descriptions, and new repositories all go
# stale, and re-running gitfolio would discard hand edits made since.
#
# tools/update_site.py rewrites only the card list, and only when something has
# actually changed, so most runs finish without a commit.
#
# Run it by hand from the Actions tab any time: Actions -> Update site -> Run workflow.

name: Update site

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  push:
    paths:
      - "tools/update_site.py"
      - "tools/site.config.json"
      - ".github/workflows/update-site.yml"
  workflow_dispatch:

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The script uses only the Python standard library, so there is nothing
      # to install and no lock file to keep current.
      - name: Refresh project cards
        env:
          # Raises the API rate limit from 60 requests an hour to 5000. Only
          # public data is read, so the automatic token is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_site.py

      - name: Commit if the card list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # No change is the normal outcome; exit cleanly rather than failing.
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: refresh project cards from the GitHub API"
          git push
